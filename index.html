<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="refresh" content="0; url=sobres.html">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patio Cinco">
<meta name="theme-color" content="#C8960C">
<title>Patio Cinco</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#C8960C;font-family:-apple-system,Arial,sans-serif}
  #splash{position:fixed;inset:0;background:#C8960C;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
  .dot{width:6px;height:6px;background:#111;border-radius:50%;margin-top:28px;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>
<!-- index.html ya no separa Dashboard/Sobres en dos apps: todo vive fusionado en sobres.html
     (panel Finanzas incluido). Esta página solo redirige — es el start_url del PWA/manifest. -->
<div id="splash">
  <img src="p-logo.png" style="width:180px;height:auto;">
  <div class="dot"></div>
</div>
<script>
location.replace('sobres.html');
</script>
</body>
</html>
