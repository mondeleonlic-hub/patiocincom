<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patio Cinco">
<meta name="theme-color" content="#000000">
<title>Patio Cinco</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:-apple-system,Arial,sans-serif}
  #shell{display:flex;flex-direction:column;height:100%;height:100dvh;padding-top:env(safe-area-inset-top)}
  #frames{flex:1;position:relative;overflow:hidden}
  #frames>.fw{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;transition:opacity .2s}
  #frames>.fw.active{opacity:1;pointer-events:all}
  iframe{width:100%;height:100%;border:none;background:#f0f0f0;display:block}
  #nav{display:flex;background:#111;border-top:1px solid #333;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
  .nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:#555;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;min-height:56px}
  .nb.on{color:#C8960C}
  .nb-icon{font-size:20px;line-height:1}
  #splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
  #splash.hide{opacity:0;pointer-events:none}
  .dot{width:6px;height:6px;background:#C8960C;border-radius:50%;margin-top:28px;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>

<!-- ── SPLASH ── -->
<div id="splash">
  <svg width="220" height="220" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <circle cx="120" cy="120" r="115" fill="none" stroke="#C8960C" stroke-width="3.5"/>
    <circle cx="120" cy="120" r="107" fill="none" stroke="#C8960C" stroke-width="0.8" opacity="0.4"/>
    <circle cx="120" cy="120" r="106" fill="#0a0a0a"/>
    <text x="120" y="58" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-size="11" font-weight="600" fill="#C8960C" letter-spacing="8" opacity="0.7">★ ★ ★</text>
    <text x="120" y="96" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-size="26" font-weight="900" fill="#C8960C" letter-spacing="6">PATIO</text>
    <text x="120" y="152" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-size="64" font-weight="900" fill="#fff">5</text>
    <text x="120" y="178" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-size="12" font-weight="700" fill="#C8960C" letter-spacing="7">CARWASH</text>
    <line x1="55" y1="190" x2="185" y2="190" stroke="#C8960C" stroke-width="1" opacity="0.5"/>
    <text x="120" y="204" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-size="9" font-weight="500" fill="#888" letter-spacing="3">REFUGIO · ÁLAMOS</text>
  </svg>
  <div class="dot"></div>
</div>

<!-- ── SHELL ── -->
<div id="shell">
  <div id="frames">
    <div class="fw active" id="fw-d">
      <iframe src="dashboard.html" title="Dashboard Financiero"></iframe>
    </div>
    <div class="fw" id="fw-s">
      <iframe src="sobres.html" title="Sobres"></iframe>
    </div>
  </div>

  <nav id="nav">
    <button class="nb on" id="nb-d" onclick="go('d',this)">
      <span class="nb-icon">📊</span>
      Dashboard
    </button>
    <button class="nb" id="nb-s" onclick="go('s',this)">
      <span class="nb-icon">✉️</span>
      Sobres
    </button>
  </nav>
</div>

<script>
function go(id, btn) {
  document.querySelectorAll('.fw').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  document.getElementById('fw-' + id).classList.add('active');
  btn.classList.add('on');
}
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('splash').classList.add('hide'), 1500);
});
</script>
</body>
</html>
