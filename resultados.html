<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Resultados Examen · Patio Cinco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Montserrat:wght@400;600;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 16px;font:14px/1.5 Montserrat,sans-serif;background:#fff;color:#2E2E2E}.w{max-width:560px;margin:auto}h1{font:400 28px 'Barlow Condensed';letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}h1 b{font-weight:700}
select{padding:10px;border:1px solid #d6d6d6;border-radius:12px;font:14px Montserrat;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:700 10px Montserrat;letter-spacing:.12em;text-transform:uppercase;color:#6b6b6b;text-align:left;padding:6px}td{padding:8px 6px;border-top:1px solid #EDEDED}
.p{color:#1e6b2e;font-weight:700}.f{color:#c0392b;font-weight:700}.rp{border:1px solid #d6d6d6;background:none;border-radius:8px;padding:4px 8px;font:600 11px Montserrat;cursor:pointer}.rp.c{background:#c0392b;color:#fff;border-color:#c0392b}.ve{border:0;background:none;color:#c0392b;font:600 11px Montserrat;cursor:pointer;padding:0;display:block}.er{background:#EDEDED;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12px;line-height:1.45}.er .b{color:#c0392b}.er .g{color:#1e6b2e}.m{color:#6b6b6b;font-size:12px;margin-top:10px}</style></head><body><div class="w"><h1>Resultados <b>Examen</b></h1>
<select id="ms"></select><div id="o" class="m">Cargando…</div>
<details style="margin-top:22px"><summary class="m" style="cursor:pointer">Agregar un resultado a mano</summary>
<div id="mf" style="display:grid;gap:8px;margin-top:10px"><input id="mn" placeholder="Nombre" style="padding:10px;border:1px solid #d6d6d6;border-radius:10px;font:14px Montserrat">
<select id="msu" style="padding:10px;border:1px solid #d6d6d6;border-radius:10px;font:14px Montserrat"><option>Refugio</option><option>Álamos</option><option>La Loma</option></select>
<input id="mc" type="number" min="0" max="20" placeholder="Aciertos (de 20)" style="padding:10px;border:1px solid #d6d6d6;border-radius:10px;font:14px Montserrat">
<select id="mr" style="padding:10px;border:1px solid #d6d6d6;border-radius:10px;font:14px Montserrat"><option value="2026-11">Primera auditoría (2026-11)</option><option value="2026-11-17">Auditoría 17 nov (2026-11-17)</option></select>
<button id="madd" style="padding:11px;border:0;border-radius:10px;background:#F8BA00;font:700 12px Montserrat;cursor:pointer">Guardar</button><div id="mm" class="m"></div></div></details></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDXwdUwNo2_3LG9d5Kg9-AtPQR8fXzV-X8",authDomain:"montseflow.firebaseapp.com",projectId:"montseflow",appId:"1:249314346746:web:0d39b74f90dad6eff22b43"});
var all=[];function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){var m=document.getElementById('ms').value,r=all.filter(function(x){return (x.ronda||x.mes)===m}).sort(function(a,b){return a.suc>b.suc?1:a.name>b.name?1:-1});
 document.getElementById('o').innerHTML=r.length?'<table><tr><th>Nombre</th><th>Sucursal</th><th>Nota</th><th></th><th></th></tr>'+r.map(function(x){return '<tr><td>'+esc(x.name)+(x.wrong&&x.wrong.length?' <button class="ve" data-id="'+esc(x.id)+'">Ver errores ('+x.wrong.length+')</button>':'')+'</td><td>'+esc(x.suc)+'</td><td>'+x.score+'/'+x.total+'</td><td class="'+(x.pass?'p':'f')+'">'+(x.pass?'Aprobó':'No aprobó')+'</td><td><button class="rp" data-id="'+esc(x.id)+'">Repetir</button></td></tr>'}).join('')+'</table><div class="m">'+r.filter(function(x){return x.pass}).length+' de '+r.length+' aprobaron · promedio '+(r.reduce(function(a,x){return a+x.score},0)/r.length).toFixed(1)+'/20</div>':'Sin resultados este mes.'}
firebase.firestore().collection('pc_examenes').get().then(function(s){s.forEach(function(d){var o=d.data();o.id=d.id;all.push(o)});var ms=Array.from(new Set(all.map(function(x){return x.ronda||x.mes}))).sort().reverse();if(!ms.length)ms=['2026-11-17'];var sel=document.getElementById('ms');sel.innerHTML=ms.map(function(m){return '<option>'+m+'</option>'}).join('');sel.onchange=draw;draw()},function(e){document.getElementById('o').textContent='No se pudieron cargar los resultados: '+(e&&e.code||'')+' '+(e&&e.message||'')});
function sl(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
document.getElementById('madd').onclick=function(){var n=document.getElementById('mn').value.trim(),su=document.getElementById('msu').value,c=parseInt(document.getElementById('mc').value,10),ro=document.getElementById('mr').value,m=document.getElementById('mm');
 if(n.length<2||isNaN(c)||c<0||c>20){m.textContent='Revisa nombre y aciertos.';return}
 var id=ro+'_'+sl(n)+'_'+sl(su),d={name:n,suc:su,mes:ro.slice(0,7),ronda:ro,score:c,total:20,pass:c>=16,date:'manual',at:new Date().toISOString(),wrong:[]};
 firebase.firestore().collection('pc_examenes').doc(id).set(d).then(function(){d.id=id;all=all.filter(function(x){return x.id!==id});all.push(d);var s=document.getElementById('ms');if(!Array.from(s.options).some(function(o){return o.value===ro})){s.insertAdjacentHTML('afterbegin','<option>'+ro+'</option>')}s.value=ro;draw();m.textContent='Guardado.'},function(er){m.textContent='No se pudo guardar: '+(er&&er.code||'')})};
document.addEventListener('click',function(e){var v=e.target.closest('.ve');if(v){var nx=v.nextElementSibling;if(nx&&nx.classList.contains('er')){nx.remove();return}var x=all.filter(function(o){return o.id===v.dataset.id})[0],h='<div class="er">'+x.wrong.map(function(w){return typeof w==='object'?'<div style="margin-bottom:8px"><b>'+esc(w.q)+'</b><div class="b">✗ '+esc(w.a)+'</div><div class="g">✓ '+esc(w.c)+'</div></div>':'<div>Pregunta '+w+'</div>'}).join('')+'</div>';v.insertAdjacentHTML('afterend',h);return}
 var b=e.target.closest('.rp');if(!b)return;
 if(!b.classList.contains('c')){b.classList.add('c');b.textContent='¿Seguro?';setTimeout(function(){b.classList.remove('c');b.textContent='Repetir'},4000);return}
 firebase.firestore().collection('pc_examenes').doc(b.dataset.id).delete().then(function(){all=all.filter(function(x){return x.id!==b.dataset.id});draw()},function(){b.textContent='Error'})});
</script></body></html>
